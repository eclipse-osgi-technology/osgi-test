# CI logic lives in eclipse-osgi-technology/.github (reusable workflow).
# A release is cut by pushing a tag that equals the version (no prefix), or
# by publishing a GitHub release with that new tag; the central workflow
# refuses a tag that does not match .mvn/maven.config.
name: release
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: read
jobs:
  release:
    # the provenance job of maven-release attests the release with SLSA
    # build provenance and attaches it to the release of the tag
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: eclipse-osgi-technology/.github/.github/workflows/maven-release.yml@aaa98d527667f930b6ff51e86e4568988b3ea1d3 # 0.0.1
    secrets: inherit
    with:
      jdk: '17'
